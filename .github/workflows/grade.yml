name: Grade assignment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grade:
    name: Grade assignment
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install numpy pytest

      - name: Grade Task 2
        id: task2
        continue-on-error: true
        run: python tests/grade_task2.py

      - name: Grade Task 4
        id: task4
        continue-on-error: true
        run: python -m pytest -q tests/grade_task4.py

      - name: Grade Task 7
        id: task7
        continue-on-error: true
        run: python -m pytest -q tests/grade_task7.py

      - name: Grade Task 8
        id: task8
        continue-on-error: true
        run: python -m pytest -q tests/grade_task8.py

      - name: Grade Task 9
        id: task9
        continue-on-error: true
        run: python -m pytest -q tests/grade_task9.py

      - name: Summarize grading results
        if: always()
        env:
          TASK2_RESULT: ${{ steps.task2.outcome }}
          TASK4_RESULT: ${{ steps.task4.outcome }}
          TASK7_RESULT: ${{ steps.task7.outcome }}
          TASK8_RESULT: ${{ steps.task8.outcome }}
          TASK9_RESULT: ${{ steps.task9.outcome }}
        run: |
          {
            echo "# Assignment grading results"
            echo
            echo "| Task | Result |"
            echo "| --- | --- |"
            echo "| Task 2 | ${TASK2_RESULT} |"
            echo "| Task 4 | ${TASK4_RESULT} |"
            echo "| Task 7 | ${TASK7_RESULT} |"
            echo "| Task 8 | ${TASK8_RESULT} |"
            echo "| Task 9 | ${TASK9_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$TASK2_RESULT" != "success" ||
                "$TASK4_RESULT" != "success" ||
                "$TASK7_RESULT" != "success" ||
                "$TASK8_RESULT" != "success" ||
                "$TASK9_RESULT" != "success" ]]; then
            exit 1
          fi
